<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f4f1;--card:#fff;--ink:#1d2421;--mute:#6b7670;--line:#ccd6cf;--head:#1f5f3f;--th:#e8efe9;--org:#e8731a;--red:#c0392b;--zebra:#f8faf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--card:#1a1f1c;--ink:#e8ece9;--mute:#9aa59f;--line:#34403a;--head:#17472f;--th:#243029;--org:#f0924a;--red:#e67c70;--zebra:#1e2421}}
:root[data-theme="dark"]{--bg:#111513;--card:#1a1f1c;--ink:#e8ece9;--mute:#9aa59f;--line:#34403a;--head:#17472f;--th:#243029;--org:#f0924a;--red:#e67c70;--zebra:#1e2421}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "Hiragino Kaku Gothic ProN","Meiryo",sans-serif}
.bar{background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;font-weight:700;font-size:16px;position:sticky;top:0;z-index:5}
main{max-width:860px;margin:0 auto;padding:10px}
.race{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.gi{display:inline-block;background:var(--org);color:#fff;font-size:12px;font-weight:700;padding:0 8px;border-radius:3px}
h1{font-size:20px;margin:6px 0 4px}
.meta{font-size:12.5px;color:var(--mute);margin:0}
.box{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--org);border-radius:6px;padding:8px 12px;margin:10px 0;font-size:13px}
.box b{color:var(--org)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
.tab{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--th);color:var(--mute);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--head);border-color:var(--head);color:#fff;font-weight:700}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
th{background:var(--th);font-size:12px;color:var(--mute);padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--zebra)}
tr.out td{opacity:.5}
.nm{font-weight:700;font-size:15px}
.sub{font-size:11.5px;color:var(--mute);display:none}
.num{text-align:right;white-space:nowrap;font-weight:700}
.num small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.tag{font-size:10.5px;padding:0 5px;border-radius:3px;margin-left:5px;border:1px solid;vertical-align:middle}
.links h3{font-size:13px;margin:12px 0 4px;color:var(--mute)}.lk{display:inline-block;margin:3px 6px 3px 0;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:13px;text-decoration:none}.tp{color:var(--head);border-color:var(--head)}.src{margin:10px 0}.s{display:inline-block;font-size:11.5px;padding:1px 8px;margin:2px 4px 2px 0;border-radius:3px}.s.ok{background:var(--th);color:var(--head)}.s.ng{background:var(--zebra);color:var(--mute)}.tg{color:var(--org);border-color:var(--org)}.tx{color:var(--red);border-color:var(--red)}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px}
.foot{font-size:11.5px;color:var(--mute);margin:14px 2px}
@media (max-width:640px){.c-t,.c-s,.c-k{display:none}.sub{display:block}td,th{padding:7px 6px}h1{font-size:18px}.nm{font-size:14.5px}}
</style></head><body>
<div class="bar">重賞ボード</div>
<main>
<section class="race"><span class="gi">{{EYEBROW}}</span><h1>{{TITLE}}</h1>
<p class="meta">{{META}}<br>データ時点：<span id="asof"></span>（登録馬段階・枠順と騎手は未確定）</p></section>
<div class="box">{{HIGHLIGHT}}</div>
<div class="tabs" id="chips"></div>
<div class="wrap"><table><thead><tr><th>印</th><th>馬名</th><th>性齢</th><th class="c-k">斤量</th><th class="c-t">厩舎</th><th class="c-s">父／母（母父）</th><th>RT</th><th>順位</th></tr></thead><tbody id="list"></tbody></table></div>
<div class="src">取得元：{{SOURCES}}</div>
{{LINKS}}
<p class="foot">出典：JRA（プレレーティング・レーティング順位・データ分析）、スポーツナビ（特別登録）。RTはJRAのレーティング、順位はJRAの日本馬レーティング順位（1〜15位のみ発表）。印はこの端末のブラウザにだけ保存されます。数値は目安であり、的中や利益を保証しません。馬券は自己責任でお楽しみください。</p>
</main>
<script>
/* ===== 毎週ここだけ差し替える（name|性齢|斤量|厩舎|父|母|母父|レーティング|該当レース|JRA順位|旗 G=GⅠ勝ち馬 X=回避） ===== */
var ASOF='{{ASOF}}';
var RAW=[
{{RAW}}
];
/* ===== ここから下は共通 ===== */
var H=RAW.map(function(s){var a=s.split('|');return{n:a[0],a:a[1],k:a[2],t:a[3],s:a[4],d:a[5],dd:a[6],r:+a[7]||0,rc:a[8],rk:+a[9]||99,f:a[10]||''}});
H.sort(function(x,y){return x.rk-y.rk||y.r-x.r});
var K='{{KEY}}',M={},flt='all';
try{M=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
document.getElementById('asof').textContent=ASOF;
var F={all:['全馬',function(){return 1}],g:['GⅠ勝ち馬',function(h){return h.f.indexOf('G')>=0}],p:['JRA注目',function(h){return h.f.indexOf('P')>=0}],y:['3歳',function(h){return h.a==='牝3'}],ok:['回避を除く',function(h){return h.f.indexOf('X')<0}]};
function chips(){document.getElementById('chips').innerHTML=Object.keys(F).map(function(k){return '<button class="tab'+(k===flt?' on':'')+'" data-k="'+k+'">'+F[k][0]+' '+H.filter(F[k][1]).length+'</button>'}).join('')}
function list(){document.getElementById('list').innerHTML=H.filter(F[flt][1]).map(function(h){
 var tg=(h.f.indexOf('G')>=0?'<span class="tag tg">GⅠ勝ち</span>':'')+(h.f.indexOf('P')>=0?'<span class="tag tp">JRA注目</span>':'')+(h.f.indexOf('X')>=0?'<span class="tag tx">回避</span>':'');
 var o=['','◎','○','▲','△','☆','×'].map(function(m){return '<option'+(M[h.n]===m?' selected':'')+'>'+m+'</option>'}).join('');
 return '<tr class="'+(h.f.indexOf('X')>=0?'out':'')+'"><td><select data-n="'+h.n+'" aria-label="印">'+o+'</select></td>'+
 '<td><span class="nm">'+h.n+'</span>'+tg+'<div class="sub">'+h.t+'　'+h.s+'／'+h.d+'（'+h.dd+'）</div></td>'+
 '<td>'+h.a+'</td><td class="c-k">'+h.k+'</td><td class="c-t">'+h.t+'</td><td class="c-s">'+h.s+'<br><small>'+h.d+'（'+h.dd+'）</small></td>'+
 '<td class="num">'+(h.r||'-')+(h.rc?'<small>'+h.rc+'</small>':'')+'</td><td class="num">'+(h.rk<99?h.rk:'-')+'</td></tr>'}).join('')}
document.getElementById('chips').addEventListener('click',function(e){var k=e.target.dataset.k;if(k){flt=k;chips();list()}});
document.getElementById('list').addEventListener('change',function(e){var n=e.target.dataset.n;if(!n)return;M[n]=e.target.value;try{localStorage.setItem(K,JSON.stringify(M))}catch(x){}});
chips();list();
</script></body></html>
