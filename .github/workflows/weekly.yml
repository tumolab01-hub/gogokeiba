name: weekly
on:
  schedule:
    - cron: "0 21 * * 1,3,4"
    - cron: "0 10 * * 5"
    - cron: "0,30 0-7 * * 6,0"
  workflow_dispatch:
concurrency:
  group: weekly
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python build.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
